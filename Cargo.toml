[workspace]
resolver = "3"
members = [
    "platform/contracts",
    "engine/connectors",
    "platform/ipc",
    "engine/machine-engine",
    "engine/kernel",
    "interfaces/mcp",
    "platform/store",
    "agenthub",
    "engine/hub",
    "runtime/link",
    "runtime/devagotchi",
    "apps/desktop/src-tauri",
]
# `cargo build` / `cargo test` at the root build the broker, adapter and their
# libraries. The Tauri inspector needs native webview toolchains, so it is a
# member (one lockfile, one toolchain) but built explicitly with `-p`.
default-members = [
    "platform/contracts",
    "engine/connectors",
    "platform/ipc",
    "engine/machine-engine",
    "engine/kernel",
    "interfaces/mcp",
    "platform/store",
    "agenthub",
    "engine/hub",
    "runtime/link",
    "runtime/devagotchi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# sqlx 0.9 sets the floor; the pinned toolchain in rust-toolchain.toml is what builds.
rust-version = "1.94"
publish = false
license = "FSL-1.1-ALv2"
repository = "https://github.com/devagotchi/devagotchi"

[workspace.dependencies]
devagotchi-contracts = { path = "platform/contracts" }
devagotchi-connectors = { path = "engine/connectors" }
devagotchi-ipc = { path = "platform/ipc" }
devagotchi-machine-engine = { path = "engine/machine-engine" }
devagotchi-kernel = { path = "engine/kernel" }
devagotchi-store = { path = "platform/store" }
devagotchi-agenthub = { path = "agenthub" }

rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "net", "sync", "signal", "time"] }
libc = "0.2"
base64 = "0.23.1"
dunce = "1.0.5"
hex = "0.4.3"
# `fallible_uint`: rusqlite 0.38 put the u64/usize conversions behind it; they store values
# up to i64::MAX and refuse larger ones, exactly as 0.37 did by default.
rusqlite = { version = "0.39", features = ["bundled", "fallible_uint"] }
# The Postgres engine every part shares (`platform/store`), AgentHub's boards included,
# standalone ones too (ADR 0005); the machine's own journals are rusqlite (the kernel and the
# machine engine, `.ai/dev/plans/path.md` decision 1).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "any", "migrate", "macros"] }
sha2 = "0.11.1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    # PSS_THREAD_ENTRY needs Diagnostics_Debug and Kernel beside ProcessSnapshotting.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ProcessSnapshotting",
    "Win32_System_Kernel",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# AgentHub is its own repository (devagotchi/agenthub, the submodule at agenthub) and
# takes these crates from this repository by git; built here, they are this workspace's own.
[patch."https://github.com/devagotchi/devagotchi"]
devagotchi-contracts = { path = "platform/contracts" }
devagotchi-connectors = { path = "engine/connectors" }
devagotchi-store = { path = "platform/store" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# The profile that 'dist' will build with. Fat LTO and one codegen unit let the
# optimizer see the whole program (smaller, faster binaries at a slower build);
# symbols are stripped because a release binary is debugged from its journal, not
# a debugger, and the attested archive is what ships.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
