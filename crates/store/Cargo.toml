[package]
name = "devagotchi-store"
description = "The Postgres engine Devagotchi's parts share: its own schema, tenant row-level security, retrying transactions; each crate brings its migrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "devagotchi_store"
path = "src/lib.rs"

[features]
# `testing`: stores for tests (a fresh Postgres database when DEVAGOTCHI_TEST_POSTGRES_URL
# names a server), for the crates built on this one.
testing = ["dep:tempfile"]

[dependencies]
devagotchi-contracts = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
getrandom = "0.4"
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
