name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Built on its own, against Devagotchi's crates by git (Cargo.toml), with the hosted
    # board's tests on a Postgres of its own.
    name: test (postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DEVAGOTCHI_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo test
