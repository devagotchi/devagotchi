[package]
name = "devagotchi-machine-engine"
description = "The Devagotchi machine engine: admission, operation lifecycle, SQLite journal, output retention, native process supervision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
devagotchi-contracts = { workspace = true }
devagotchi-ipc = { workspace = true }
hex = { workspace = true }
# The broker's SQLite journal.
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The broker, journal, and execution lifecycle build where a native execution
# provider exists.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
base64 = { workspace = true }
dunce = { workspace = true }
# search_files: ripgrep's walker (honours .gitignore and hidden files) and its regex engine.
globset = "0.4"
ignore = "0.4"
regex = "1"
# read_url: the same reqwest and rustls the hub and the link already build with.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# list_processes and kill_process: one process table on Linux and Windows.
sysinfo = { version = "0.40", default-features = false, features = ["system", "user"] }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
devagotchi-ipc = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
