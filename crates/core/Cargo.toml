[package]
name = "devagotchi-core"
description = "The Devagotchi machine engine: admission, operation lifecycle, SQLite journal, output retention, native process supervision, and the machine's private AI evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
devagotchi-contracts = { workspace = true }
devagotchi-ipc = { workspace = true }
getrandom = "0.4"
hex = { workspace = true }
# The SQLite journals: the broker's, and `ai`'s (the machine's private AI evidence).
rusqlite = { workspace = true }
# `devagotchi ai schema`: the capture event's JSON schema.
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The broker, journal, and execution lifecycle build where a native execution
# provider exists.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
base64 = { workspace = true }
dunce = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
devagotchi-ipc = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
