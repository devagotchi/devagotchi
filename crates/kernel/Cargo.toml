[package]
name = "devagotchi-kernel"
description = "The Devagotchi kernel: every piece of Devagotchi's own AI-specific code, one domain per folder (capture: the `devagotchi ai` command's policy, harness hooks and private evidence journal)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
devagotchi-contracts = { workspace = true }
getrandom = "0.4"
hex = { workspace = true }
# `capture`'s SQLite journal: the machine's private AI evidence.
rusqlite = { workspace = true }
# `devagotchi ai schema`: the capture event's JSON schema.
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
