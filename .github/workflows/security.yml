name: security

on:
  # Until alpha (operator, 2026-11-24): a pull request is checked only when it changes the
  # dependency graph or this policy. An advisory published against an untouched crate shows
  # up on main and in the weekly run, and is fixed on main, instead of failing every PR.
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .github/workflows/security.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly: the advisory database moves without us

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check
          arguments: --all-features
          rust-version: "1.99.1"
