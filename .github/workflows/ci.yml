name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-owner:
    name: Check repository owner references
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject historical owner outside recorded history
        run: |
          old_owner='eonsof''stupid'
          status=0
          git grep -in -F "$old_owner" -- . ':!CHANGELOG.md' ':!verification/**' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Historical owner found outside CHANGELOG.md and verification/" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then exit "$status"; fi

  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Each native execution provider runs its lifecycle tests on its own OS.
        # windows-2022 keeps the pre-24H2 console path; windows-2025 (build 26100)
        # has ReleasePseudoConsole. macOS has no provider yet: the contracts, the
        # IPC crate and the adapter build and test there, and the broker binary
        # reports unsupported_platform. ubuntu-24.04-arm and windows-11-arm run the same
        # tests natively on 64-bit ARM (aarch64 Linux, Arm64 Windows 11).
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-2022, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2 (2026-10-24)
        with:
          tool: cargo-nextest
      # Default members: contracts, ipc, core, broker, mcp, hub. The Tauri inspector
      # is a workspace member but needs native webview toolchains; it gets its
      # own job when it enters CI.
      - run: cargo build --locked --bins
      # nextest runs every test binary (library, binary and integration tests),
      # one process per test, with the profile in .config/nextest.toml.
      - run: cargo nextest run --locked --profile ci

  hub-postgres:
    # The hub's store has two backends (crates/hub/src/store.rs): every hub test that takes
    # a store runs on SQLite in `core` and here on Postgres as well, against a throwaway
    # cluster of the runner image's PostgreSQL. A test that cannot reach it fails; none
    # skips Postgres silently while DEVAGOTCHI_TEST_POSTGRES_URL is set.
    name: hub (postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2 (2026-10-24)
        with:
          tool: cargo-nextest
      - name: Start a throwaway Postgres
        run: tests/throwaway_postgres.sh
      # The export's real-ClickHouse test (warehouse/tests.rs) runs against it.
      - name: Start a throwaway ClickHouse
        run: tests/throwaway_clickhouse.sh
      - run: cargo nextest run --locked --profile ci -p devagotchi-hub
        env:
          DEVAGOTCHI_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:55432/postgres
          DEVAGOTCHI_TEST_CLICKHOUSE_URL: http://127.0.0.1:18123
          DEVAGOTCHI_TEST_CLICKHOUSE_USER: devagotchi

  hub-compose:
    # The self-hosted stack (deploy/compose/): the hub image built from this commit, its own
    # Postgres over a Unix socket and Caddy for TLS, brought up as a user would, then
    # checked through Caddy by deploy/compose/check.sh.
    name: hub (compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the hub image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/Dockerfile
          tags: devagotchi-hub:ci
          load: true
          cache-from: type=gha,scope=hub-image
          cache-to: type=gha,scope=hub-image,mode=max
      - name: Bring the stack up
        working-directory: deploy/compose
        run: |
          printf '%s\n' DEVAGOTCHI_DOMAIN=localhost DEVAGOTCHI_HTTP_PORT=8080 \
            DEVAGOTCHI_HTTPS_PORT=8443 DEVAGOTCHI_PUBLIC_URL=https://localhost:8443 \
            DEVAGOTCHI_IMAGE=devagotchi-hub:ci \
            "DEVAGOTCHI_CLICKHOUSE_PASSWORD=$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')" > .env
          docker compose up -d --no-build --wait --wait-timeout 180
      - name: Check it as a user would
        working-directory: deploy/compose
        run: ./check.sh --fresh
      - name: Restart and check again
        working-directory: deploy/compose
        run: |
          docker compose restart hub
          ./check.sh --fresh
      - name: Logs
        if: always()
        working-directory: deploy/compose
        run: docker compose logs --no-color --tail 200 || true

  hub-deploy:
    # The deploy scripts: deploy/compose/install.sh, update.sh and backup.sh for real with the
    # hub image built from this commit, served by a local registry as the track they follow
    # (pinned by digest, an unhealthy image rolled back), and deploy/proxmox/hub-up.sh
    # against a stand-in Proxmox host. Not the image GHCR publishes: that exists only once
    # the commit is on main (release.yml, image.yml).
    name: hub (deploy scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the hub image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/Dockerfile
          tags: devagotchi-hub:ci
          load: true
          cache-from: type=gha,scope=hub-image
          cache-to: type=gha,scope=hub-image,mode=max
      - run: python3 tests/proxmox_hub_up.py
      - run: sudo bash tests/deploy_scripts.sh devagotchi-hub:ci

  e2e:
    # The built binaries, end to end: broker, stdio adapter, hub over HTTP MCP.
    # Unix socket on Linux, named pipe on Windows; same probes (tests/e2e.py).
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Every hub these probes start keeps accounts and boards in Postgres (docs/adr/0001),
      # and a database holds one hub (migration 0007): a throwaway server on Linux
      # (tests/throwaway_postgres.sh), the runner image's own PostgreSQL on windows-2022 and
      # windows-2025 (installed, disabled, user postgres/root), with an empty database under
      # it for each step's hubs. windows-11-arm has none, so it runs the broker and adapter
      # only.
      DEVAGOTCHI_PG: ${{ startsWith(matrix.os, 'ubuntu') && 'postgres://postgres@127.0.0.1:55432' || 'postgres://postgres:root@127.0.0.1:5432' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Start a throwaway Postgres
        if: runner.os == 'Linux'
        run: tests/throwaway_postgres.sh e2e claim passkey device_login operator analytics workflow first_connect app clients orgs
      - name: Start the runner's PostgreSQL service
        if: matrix.os == 'windows-2022' || matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          Get-Service postgresql* | Set-Service -StartupType Manual
          Get-Service postgresql* | Start-Service
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -p 5432
          $env:PGPASSWORD = 'root'
          foreach ($db in 'e2e', 'install', 'install_join', 'install_update') {
            & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -p 5432 -U postgres $db
            if ($LASTEXITCODE -ne 0) { throw "createdb $db failed" }
          }
      - run: cargo build --locked --bins
      # Two builds of this commit by name (crates/devagotchi/build.rs), for machine_update
      # from one to the other (tests/machine_update_probe.py); then target/debug as it was.
      - name: Builds ci-a and ci-b
        if: runner.os == 'Linux'
        run: |
          for build in a b; do
            DEVAGOTCHI_BUILD=ci-$build cargo build --locked --bin devagotchi
            mkdir -p "$RUNNER_TEMP/build-$build" && cp target/debug/devagotchi "$RUNNER_TEMP/build-$build/"
          done
          cargo build --locked --bin devagotchi
      # e2e.py also runs tests/oauth_probe.py: DCR, PKCE through a fake upstream,
      # MCP initialize and whoami for a new account, a returning subject, and a
      # second provider with the same verified email; on Linux, machine_update from ci-a to ci-b.
      - run: python tests/e2e.py --bin-dir target/debug
        if: runner.os == 'Windows' && matrix.os != 'windows-11-arm'
        env:
          DEVAGOTCHI_HUB_STORAGE_URL: ${{ env.DEVAGOTCHI_PG }}/e2e
      - run: python tests/e2e.py --bin-dir target/debug --no-hub
        if: matrix.os == 'windows-11-arm'
      # The export of board events to ClickHouse, stopped and started mid-run (R1 step 9).
      - name: Start a throwaway ClickHouse
        if: runner.os == 'Linux'
        run: tests/throwaway_clickhouse.sh
      - run: python tests/e2e.py --bin-dir target/debug --update-builds "$RUNNER_TEMP/build-a" "$RUNNER_TEMP/build-b" --clickhouse-container dvg-ch
        if: runner.os == 'Linux'
        env:
          DEVAGOTCHI_HUB_STORAGE_URL: ${{ env.DEVAGOTCHI_PG }}/e2e
          DEVAGOTCHI_CLICKHOUSE_URL: http://127.0.0.1:18123
          DEVAGOTCHI_CLICKHOUSE_USER: devagotchi
      # The hub's own sign-in pages in a real browser, the runner image's Chrome with a
      # virtual passkey: claiming a new hub from its log's link, the owner link, signing in,
      # `devagotchi login` approved on the hub's /device page, the operator letting a
      # waiting person in on /operator, the operator's analytics moving as people visit,
      # connect, enroll a machine and run on it, and a workflow's link: no sign-in, Get my
      # command, this runner joining with the page's line as is, the step ticked in place;
      # and first connect: sign up on the one page, straight back to the app, a machine online;
      # and the phone app on an iPhone 13 and a Pixel 7: home, no sideways scroll, offline.
      # Playwright is pinned by hash (tests/requirements-browser.txt) and downloads nothing.
      - name: Sign-in pages in Chrome
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python -m pip install --require-hashes --no-deps -r tests/requirements-browser.txt
          # Each script's hub starts on an empty database of its own (a database holds one hub).
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/claim python tests/claim_browser.py --channel chrome --devagotchi "$PWD/target/debug/devagotchi"
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/passkey python tests/passkey_browser.py --channel chrome --devagotchi "$PWD/target/debug/devagotchi"
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/device_login python tests/device_login_browser.py --channel chrome --devagotchi "$PWD/target/debug/devagotchi"
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/operator python tests/operator_browser.py --channel chrome --devagotchi "$PWD/target/debug/devagotchi"
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/analytics python tests/analytics_browser.py --channel chrome --devagotchi "$PWD/target/debug/devagotchi"
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/workflow python tests/workflow_browser.py --channel chrome --machine join --devagotchi "$PWD/target/debug/devagotchi"
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/first_connect python tests/first_connect_browser.py --channel chrome --machine join --devagotchi "$PWD/target/debug/devagotchi"
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/app python tests/app_browser.py --channel chrome --devagotchi "$PWD/target/debug/devagotchi"
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/orgs python tests/orgs_browser.py --channel chrome --devagotchi "$PWD/target/debug/devagotchi"
      # Real AI clients connect through the hub's own OAuth server as a person connects them:
      # the official MCP TypeScript SDK and the Codex CLI (locked in tests/clients), each
      # registering, approved on the consent page in Chrome, then listing and calling tools.
      - name: AI clients connect (MCP SDK, Codex)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npm ci --prefix tests/clients --ignore-scripts --no-audit --no-fund
          DEVAGOTCHI_HUB_STORAGE_URL=$DEVAGOTCHI_PG/clients python tests/clients_oauth.py --channel chrome --devagotchi "$PWD/target/debug/devagotchi"
      # The Windows installer, as a user would run it: install from the build, start the
      # broker, register with a Claude Desktop config that already has Desktop Commander,
      # then use exactly the registered command. PowerShell 7 on 2025 and on Arm64
      # (windows-11-arm), 5.1 on 2022.
      - name: Windows installer (PowerShell 7)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        env:
          DEVAGOTCHI_HUB_STORAGE_URL: ${{ env.DEVAGOTCHI_PG }}/install
          DEVAGOTCHI_HUB_JOIN_STORAGE_URL: ${{ env.DEVAGOTCHI_PG }}/install_join
          DEVAGOTCHI_HUB_UPDATE_STORAGE_URL: ${{ env.DEVAGOTCHI_PG }}/install_update
        run: ./deploy/windows/ci-install-check.ps1
      # No Postgres on the Arm64 image: the installer, broker and uninstall are checked; the
      # script skips the hub, link and join parts when the storage URL is empty.
      - name: Windows installer (PowerShell 7, Arm64, no hub)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        env:
          DEVAGOTCHI_HUB_STORAGE_URL: ''
        run: ./deploy/windows/ci-install-check.ps1
      - name: Windows installer (Windows PowerShell 5.1)
        if: matrix.os == 'windows-2022'
        shell: powershell
        env:
          DEVAGOTCHI_HUB_STORAGE_URL: ${{ env.DEVAGOTCHI_PG }}/install
          DEVAGOTCHI_HUB_JOIN_STORAGE_URL: ${{ env.DEVAGOTCHI_PG }}/install_join
          DEVAGOTCHI_HUB_UPDATE_STORAGE_URL: ${{ env.DEVAGOTCHI_PG }}/install_update
        run: ./deploy/windows/ci-install-check.ps1

  host-install:
    # The Linux server installer on a real systemd host: a dedicated account with lingering,
    # user services from root-owned binaries, the link joining a hub with a piped code, upgrade,
    # crash recovery, a revoke that leaves the link down, and uninstall. x86_64 and aarch64.
    name: host-install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck deploy/linux/*.sh crates/hub/src/join/join.sh
      - run: rustup toolchain install
      - run: cargo build --locked --bins
      - name: Start a throwaway Postgres
        run: tests/throwaway_postgres.sh install install_join install_update install_role install_idp
      # The installer gets Caddy from apt. GitHub's x64 runners use an Azure mirror whose name
      # has stopped resolving for minutes at a time; Ubuntu's own archive serves the same files.
      - name: Ubuntu's own mirror when the runner's does not resolve
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ] && grep -q azure.archive.ubuntu.com /etc/apt/apt-mirrors.txt \
            && ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            echo "::warning::azure.archive.ubuntu.com does not resolve; using archive.ubuntu.com"
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
      - run: deploy/linux/ci-install-check.sh
        env:
          DEVAGOTCHI_HUB_STORAGE_URL: postgres://postgres@127.0.0.1:55432/install
          DEVAGOTCHI_HUB_JOIN_STORAGE_URL: postgres://postgres@127.0.0.1:55432/install_join
          DEVAGOTCHI_HUB_UPDATE_STORAGE_URL: postgres://postgres@127.0.0.1:55432/install_update
          DEVAGOTCHI_HUB_ROLE_STORAGE_URL: postgres://postgres@127.0.0.1:55432/install_role
          DEVAGOTCHI_HUB_IDP_STORAGE_URL: postgres://postgres@127.0.0.1:55432/install_idp
