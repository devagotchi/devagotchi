name: ui

# The Svelte UI and ColdLight (ui/, ui.md). Until alpha (operator, 2026-11-24) it runs only when
# ui/ or this file changes. It fails on any npm advisory, as cargo deny does for the workspace:
# an advisory is fixed at its source, never ignored.
on:
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: ui (tokens, check, lint, test, catalog, build, storybook)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # No dependency runs an install script; esbuild's only speeds up a binary its optional
      # platform package already ships.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: No npm advisory
        run: npm audit --audit-level=low
      - name: Type-check (Svelte accessibility warnings fail it)
        run: npm run check
      - name: Lint (tokens only, level boundaries, no fetch outside src/api)
        run: npm run lint
      - run: npm run test
      - name: The catalog matches the sources
        run: npm run catalog:check
      - run: npm run build
      - run: npm run build-storybook
