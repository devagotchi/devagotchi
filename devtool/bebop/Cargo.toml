[package]
name = "devagotchi-bebop"
description = "bebop, the rules devtool: rules as data under .ai/rules, checked against the workspace's tree (internal build only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "bebop"
path = "src/main.rs"

[dependencies]
# The tree walk honours .gitignore (ignore) and a rule's scope is a set of globs (globset),
# as the machine engine already uses them. Rules are TOML; the XML report is written by hand.
globset = "0.4"
ignore = "0.4"
serde = { workspace = true }
toml = "1"

[dev-dependencies]
tempfile = { workspace = true }

# A devtool: never in the official build, so cargo-dist never ships it (program §6).
[package.metadata.dist]
dist = false
